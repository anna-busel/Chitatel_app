name: chitatel_app
description: "ЧИТАТЕЛЬ — книжный клуб Анны Бусел"
publish_to: 'none'
version: 1.0.2+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # 17.10.2026: версии ЗАКРЕПЛЕНЫ точно (без ^). pubspec.lock в репозитории
  # нет (.gitignore), и каждая сборка Codemagic брала свежие версии сама:
  # сборка 68 тихо получила другие библиотеки и показала чёрный экран.
  # Здесь — ровно то, на чём работала сборка 67 (лог Codemagic 02.10.2026).
  # Обновлять только руками и только с проверкой на телефоне.
  cupertino_icons: 1.0.9
  google_fonts: 6.3.3
  shimmer: 3.0.0
  go_router: 14.8.1
  flutter_riverpod: 2.6.1
  shared_preferences: 2.5.5
  dio: 5.11.1
  flutter_secure_storage: 9.2.4
  google_sign_in: 6.3.0
  sign_in_with_apple: 6.1.4
  url_launcher: 6.3.2
  just_audio: 0.10.6
  audio_service: 0.18.19
  audio_session: 0.2.4
  rxdart: 0.28.0
  path_provider: 2.1.6
  socket_io_client: 2.0.3+1
  image_picker: 1.2.3
  image_cropper: 12.2.1
  record: 6.2.1
  in_app_purchase: 3.3.1
  # Пуши на Android (FCM, задачи C3–C5 ANDROID-PLAN). На iOS не
  # инициализируется — там APNs через свой канал. 17.10.2026: зрелая ветка
  # 4.x/16.x вместо только что вышедших 5.0.0/17.0.0 (их взяла сборка 68).
  firebase_core: 4.12.1
  firebase_messaging: 16.4.3
  cached_network_image: 3.4.1

# Вложенные библиотеки, которые между сборками 67 и 68 сменили версию сами.
# Держим их как в рабочей 67 (в т.ч. хранилище настроек — его читает
# роутер на первом кадре).
dependency_overrides:
  shared_preferences_android: 2.4.28
  image_picker_android: 0.8.13+23
  image_picker_ios: 0.8.13+9
  image_picker_platform_interface: 2.11.1
  in_app_purchase_android: 0.5.3
  in_app_purchase_storekit: 0.4.13
  jni_flutter: 1.0.3
  sqflite: 2.4.4
  sqflite_android: 2.4.4
  sqflite_common: 2.5.13
  sqflite_darwin: 2.4.4
  synchronized: 3.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/book-covers/
