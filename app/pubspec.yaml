name: chitatel_app
description: "ЧИТАТЕЛЬ — книжный клуб Анны Бусел"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  go_router: ^14.6.2
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.3
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4
  url_launcher: ^6.3.1
  just_audio: ^0.10.4
  audio_service: ^0.18.18
  audio_session: ^0.2.2
  rxdart: ^0.28.0
  path_provider: ^2.1.5
  socket_io_client: ^2.0.3+1
  image_picker: ^1.1.2
  image_cropper: ^12.0.0
  record: ^6.1.1
  in_app_purchase: ^3.3.0
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/book-covers/
