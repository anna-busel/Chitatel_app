name: chitatel_app
description: "ЧИТАТЕЛЬ — книжный клуб Анны Бусел"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Шрифты: Playfair Display подключается через google_fonts пакет (загрузка из сети).
  # Системный шрифт (SF Pro / Roboto) используется по умолчанию.
  # assets:
  #   - assets/images/
  #   - assets/fonts/
