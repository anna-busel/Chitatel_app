name: chitatel_app
description: "ЧИТАТЕЛЬ — книжный клуб Анны Бусел"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  go_router: ^14.2.0
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.2.2
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  google_sign_in: ^6.2.1
  url_launcher: ^6.2.6
  # — Аудиоплеер (задача 2.7) —
  # Версии зафиксированы: latest несовместим с Flutter 3.22.3
  # just_audio 0.10+ ломает API стримов; audio_service 0.19+ требует Flutter 3.27+
  just_audio: ^0.9.40
  audio_service: ^0.18.15
  audio_session: ^0.1.21
  rxdart: ^0.27.7
  path_provider: ^2.1.3
  # — Клуб (задача 4.5) —
  # Socket.io клиент для real-time чата клуба.
  # Версия 2.x совместима с сервером Socket.io 4.x (наш сервер — 4.7.5).
  socket_io_client: ^2.0.3+1
  # — Картинки в чате (задача 4.6) —
  # image_picker: выбор фото из галереи / съёмка камерой на iOS.
  # 1.x стабильна с Flutter 3.22.3. Требует NSPhotoLibraryUsageDescription
  # и NSCameraUsageDescription в Info.plist (уже добавлены в задаче 0.6).
  image_picker: ^1.1.2
  # — Голосовые сообщения (задача 4.12) —
  # record: запись аудио на iOS (AAC m4a). Только Анна-admin записывает
  # (продуктовое правило). Требует NSMicrophoneUsageDescription в Info.plist.
  # Воспроизведение — через just_audio (выше, не дублируем).
  #
  # ВАЖНО (конфликт версий): record 5.1.x по умолчанию тянет свежий
  # record_linux 0.7.2, который реализует НЕ ту версию RecordPlatform что
  # требует подтянутый record_platform_interface → сборка iOS падает
  # "RecordLinux is missing implementations". record_linux на iOS не нужен
  # вовсе (Linux-реализация), но Flutter компилирует весь граф зависимостей.
  # Лечится фиксацией точных совместимых версий + dependency_overrides ниже.
  record: 5.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# Принудительная фиксация транзитивных зависимостей record под Flutter 3.22.3.
# record_linux 0.7.1 реализует тот же интерфейс, что и закреплённый
# record_platform_interface 1.0.4 → "missing implementations" исчезает.
# record_darwin — нативная iOS-реализация (её и используем фактически).
dependency_overrides:
  record_linux: 0.7.1
  record_platform_interface: 1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/book-covers/
