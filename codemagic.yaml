workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.44.6
      xcode: latest
      cocoapods: default
      groups:
        - appstore_credentials
      vars:
        APP_STORE_APPLE_ID: 6779357856
        BUNDLE_ID: app.chitatel.ios
    integrations:
      app_store_connect: chitatel-key
    scripts:
      - name: Get Flutter packages
        working_directory: app
        script: |
          flutter pub get
      - name: Install pods
        working_directory: app
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Initialize keychain
        script: |
          keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Set up code signing settings on Xcode project
        working_directory: app
        script: |
          xcode-project use-profiles
      - name: Flutter build ipa
        working_directory: app
        script: |
          flutter build ipa --release \
            --build-name=1.0.2 \
            --build-number=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID") + 1)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - app/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - app/flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false

  android-debug:
    name: Android debug APK
    # Mac, а не linux_x2: бесплатные 500 минут Codemagic дают только на macOS M2.
    # Android прекрасно собирается на маке, просто машина дороже по минутам.
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.44.6
      java: 17
    scripts:
      - name: Get Flutter packages
        working_directory: app
        script: |
          flutter pub get
      - name: Flutter build apk (debug)
        working_directory: app
        script: |
          flutter build apk --debug
    artifacts:
      - app/build/app/outputs/flutter-apk/*.apk

  android-release:
    name: Android release AAB
    # Та же машина, что и у отладочной сборки — см. комментарий выше.
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.44.6
      java: 17
      groups:
        # Группа переменных в настройках приложения (Environment variables).
        # Нужны четыре штуки, все помечены Secret:
        #   CM_KEYSTORE           — файл chitatel-upload.jks в base64
        #   CM_KEYSTORE_PASSWORD  — пароль хранилища
        #   CM_KEY_ALIAS          — chitatel
        #   CM_KEY_PASSWORD       — пароль ключа (у нас совпадает с паролем хранилища)
        - google_play_credentials
    scripts:
      - name: Set up keystore and key.properties
        script: |
          set -e

          if [ -z "$CM_KEYSTORE" ]; then
            echo "CM_KEYSTORE пуста: переменная не подключилась к сборке."
            echo "Проверь, что у неё группа google_play_credentials."
            exit 1
          fi

          # Длину печатаем намеренно: по ней видно, скопирована ли строка
          # целиком. Ожидаем около 3000 символов; заметно меньше — значит
          # при вставке строку обрезали.
          echo "Длина CM_KEYSTORE: ${#CM_KEYSTORE} символов"

          # Переносы строк и пробелы легко попадают в переменную при
          # копировании, а base64 на macOS на них спотыкается — чистим.
          # openssl вместо base64: -A принимает вход одной длинной строкой
          # и ведёт себя одинаково на любой машине.
          printf '%s' "$CM_KEYSTORE" | tr -d '\n\r \t' | openssl base64 -d -A \
            > "$CM_BUILD_DIR/app/android/app/chitatel-upload.jks"

          SIZE=$(wc -c < "$CM_BUILD_DIR/app/android/app/chitatel-upload.jks")
          echo "Размер keystore: $SIZE байт"
          if [ "$SIZE" -lt 1000 ]; then
            echo "Keystore получился слишком маленьким — строка base64 неполная."
            exit 1
          fi

          # Путь к хранилищу относительный: build.gradle.kts резолвит storeFile
          # через file() внутри модуля app, то есть от app/android/app.
          cat > "$CM_BUILD_DIR/app/android/key.properties" <<EOF
          storeFile=chitatel-upload.jks
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF

          echo "key.properties создан"
      - name: Get Flutter packages
        working_directory: app
        script: |
          flutter pub get
      - name: Flutter build appbundle (release)
        working_directory: app
        script: |
          # Версия — из pubspec, номер сборки — счётчик Codemagic: у каждой
          # загрузки в Play должен быть свой versionCode, иначе консоль
          # отклонит файл.
          flutter build appbundle --release \
            --build-number=$PROJECT_BUILD_NUMBER
    artifacts:
      - app/build/app/outputs/bundle/release/*.aab
      - app/build/app/outputs/mapping/release/mapping.txt
