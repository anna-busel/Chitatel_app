# CRM команды ЧИТАТЕЛЬ — https://crm.chitatel.app (CRM-PLAN A5).
#
# Статика — сборка crm/dist, скопированная rsync в /var/www/crm.chitatel.app
# (см. deploy/CRM-DEPLOY.md). /api — тот же Node-сервер, что у api.chitatel.app
# (pm2 chitatel-api, 127.0.0.1:3000), поэтому CRM ходит в API со своего домена
# и CORS для неё не нужен.
#
# Файл пишется без SSL: блок 443 и редирект с 80 добавит
#   certbot --nginx -d crm.chitatel.app -d pay.chitatel.app
#
# ⚠️ В /etc/nginx/sites-enabled/ не держать копии .bak — nginx грузит оттуда
# все файлы (AI-CONTEXT-5 §18.1).

server {
    listen 80;
    listen [::]:80;
    server_name crm.chitatel.app;

    root /var/www/crm.chitatel.app;
    index index.html;

    # Импорт из ГетКурса (H) — выгрузки CSV/Excel. Лимит сервера на свои
    # загрузки задаётся в multer; здесь — с запасом.
    client_max_body_size 100M;

    # API — на тот же бэкенд, что и api.chitatel.app. Путь передаётся как есть.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Сервер доверяет одному прокси (app.set('trust proxy', 1)) и берёт IP
        # из X-Forwarded-For — на нём держатся лимиты входа.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_body_timeout 300s;
    }

    # Файлы сборки с хешем в имени — кэш навсегда.
    location /assets/ {
        try_files $uri =404;
        expires max;
        access_log off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # SPA: любой путь интерфейса (/clients, /orders/123 …) → index.html.
    # index.html не кэшируем, чтобы после деплоя сразу подтягивалась новая сборка.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.chitatel.app; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    }
}
