# Страницы оплаты — https://pay.chitatel.app (CRM-PLAN A5, страницы — E2/E3).
#
# Пока страниц нет: домен целиком проксируется на Node-сервер API
# (pm2 chitatel-api, 127.0.0.1:3000), как api.chitatel.app. Когда появятся
# страницы оплаты (E3), здесь останется только то, что им нужно.
#
# Файл пишется без SSL: блок 443 и редирект с 80 добавит
#   certbot --nginx -d crm.chitatel.app -d pay.chitatel.app

server {
    listen 80;
    listen [::]:80;
    server_name pay.chitatel.app;

    client_max_body_size 2M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
