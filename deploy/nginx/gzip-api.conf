# /etc/nginx/conf.d/gzip-api.conf на VPS (13.11.2026). `gzip on` уже в nginx.conf.
# Зачем: у части российских провайдеров соединение с зарубежным сервером
# «замирает» после ~15–20 КБ; каталог (~25 КБ JSON) без VPN не догружался.
# После включения: /api/books?limit=20 — 25 459 → 5 915 байт. Картинки и аудио не сжимаются.
gzip_proxied any;
gzip_types application/json text/plain text/css application/javascript;
gzip_min_length 1024;
gzip_vary on;
